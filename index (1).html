<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ver Glouton</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1230;--ink:#fdf6ff;--mut:#bfaee0;--acc:#ff9f43;--panel:rgba(20,12,40,.72);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',ui-rounded,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);pointer-events:none}
.pill{background:var(--panel);border-radius:16px;padding:8px 14px;font-weight:700;font-size:18px}
#lb{font-size:13px;font-weight:500;min-width:130px;line-height:1.5}
#lb b{color:var(--acc)}
#lb div{display:flex;justify-content:space-between;gap:12px}
#bt{position:fixed;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:88px;height:88px;border-radius:50%;border:0;background:var(--acc);color:#2a1300;font:700 18px 'Fredoka',system-ui,sans-serif;box-shadow:0 0 0 6px rgba(255,159,67,.25);touch-action:none}
#bt:active{transform:scale(.94)}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(27,18,48,.8);padding:24px}
.ov[hidden]{display:none}
.card{max-width:380px;text-align:center}
h1{font-size:clamp(40px,12vw,64px);line-height:1;margin:0 0 14px;font-weight:700}
.card p{margin:0 0 22px;color:var(--mut);font-size:18px;line-height:1.4}
.card .big{color:var(--ink);font-size:22px;margin-bottom:6px}
.gb{border:2px solid var(--mut);background:transparent;color:var(--ink);border-radius:999px;font:500 17px 'Fredoka',system-ui,sans-serif;padding:10px 26px;margin-top:14px}
#who{margin-top:10px;font-size:15px;color:var(--mut);min-height:20px}
.go{border:0;border-radius:999px;background:var(--acc);color:#2a1300;font:700 22px 'Fredoka',system-ui,sans-serif;padding:14px 40px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="pill" id="sc">Longueur 10</div><div class="pill" id="lb"></div></div>
<button id="bt">Turbo</button>
<div class="ov" id="menu"><div class="card"><h1>Ver Glouton</h1><p>Glisse ton doigt pour guider ton ver. Avale les billes, évite le corps des autres vers et reste dans l’arène.</p><button class="go" id="play">Jouer</button><div><button class="gb" id="gin">Se connecter avec Google</button></div><div id="who"></div></div></div>
<div class="ov" id="over" hidden><div class="card"><h1>Avalé !</h1><p class="big" id="fin"></p><p id="rec"></p><button class="go" id="again">Rejouer</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,D;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D}
addEventListener('resize',rs);rs();
const WS=3200,rnd=(a,b)=>a+Math.random()*(b-a),R=w=>9+Math.sqrt(w.mass)*.55;
const NAMES=['Zigzag','Miam','Croc','Pixel','Nouille','Spirale','Gigot','Fusée','Biscotte','Moustache','Tornade','Lutin','Pépite','Bouboule'];
let worms=[],food=[],me,focus,state='menu',best=0,boost=false,mouse={x:0,y:0,has:false},cam={x:WS/2,y:WS/2},Z=.8,lbT=0;
try{best=+localStorage.getItem('vg_best')||0}catch(e){}
function mk(bot,name){const a=rnd(0,6.28),x=rnd(300,WS-300),y=rnd(300,WS-300),w={bot,name,hue:bot?Math.floor(rnd(0,360)):28,mass:10,ang:a,segs:[],dead:false,drop:0,wait:0,bst:false,tm:0,goal:a};
 for(let i=0;i<12;i++)w.segs.push({x:x-Math.cos(a)*i*6,y:y-Math.sin(a)*i*6});return w}
function addFood(x,y,v,h){food.push({x,y,v,h:h===undefined?rnd(0,360):h})}
function seed(){while(food.length<380)addFood(rnd(40,WS-40),rnd(40,WS-40),rnd(1,2.2))}
function init(){worms=[];me=mk(false,'Toi');me.dead=true;worms.push(me);for(let i=0;i<14;i++)worms.push(mk(true,NAMES[i]));focus=worms[1];seed()}
function die(w){w.dead=true;w.wait=3;const n=w.segs.length,v=Math.min(6,Math.max(1.5,w.mass*1.6/n));
 for(let i=0;i<n;i+=2){const s=w.segs[i];addFood(s.x+rnd(-8,8),s.y+rnd(-8,8),v,w.hue)}
 if(food.length>1000)food.splice(0,food.length-1000);
 if(w===me){state='over';const sc=Math.floor(me.mass);if(sc>best){best=sc;try{localStorage.setItem('vg_best',best)}catch(e){}}
  document.getElementById('fin').textContent='Longueur finale : '+sc;
  document.getElementById('rec').textContent='Meilleur score : '+best;
  setTimeout(()=>{if(state==='over')document.getElementById('over').hidden=false},700)}}
const nd=d=>((d+Math.PI*3)%(Math.PI*2))-Math.PI;
function ai(w,dt){const h=w.segs[0];w.bst=false;w.tm-=dt;
 if(w.tm<=0){w.tm=rnd(.15,.4);let b=null,bd=450*450;
  for(const f of food){const dx=f.x-h.x,dy=f.y-h.y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=f}}
  w.goal=b?Math.atan2(b.y-h.y,b.x-h.x):w.goal+rnd(-.9,.9)}
 let a=w.goal;const m=220;
 if(h.x<m||h.x>WS-m||h.y<m||h.y>WS-m)a=Math.atan2(WS/2-h.y,WS/2-h.x);
 const hx=h.x+Math.cos(w.ang)*90,hy=h.y+Math.sin(w.ang)*90;
 out:for(const o of worms){if(o===w||o.dead)continue;const lim=R(o)+45;
  for(let i=0;i<o.segs.length;i+=2){const s=o.segs[i],dx=s.x-hx,dy=s.y-hy;
   if(dx*dx+dy*dy<lim*lim){const oa=Math.atan2(s.y-h.y,s.x-h.x);a=w.ang-Math.sign(nd(oa-w.ang)||1)*1.3;break out}}}
 w.want=a}
function step(dt){
 for(const w of worms){
  if(w.dead){if(w.bot&&(w.wait-=dt)<=0)Object.assign(w,mk(true,w.name));continue}
  if(w.bot)ai(w,dt);else{w.bst=boost;if(mouse.has)w.want=Math.atan2(mouse.y-H/2,mouse.x-W/2)}
  if(w.want!==undefined){const rate=(w.bot?3.4:4.4)*(1-Math.min(w.mass/1500,.4));const d=nd(w.want-w.ang);w.ang+=Math.max(-rate*dt,Math.min(rate*dt,d))}
  let sp=150;
  if(w.bst&&w.mass>14){sp=270;w.mass-=5*dt;w.drop+=dt;if(w.drop>.12){w.drop=0;const t=w.segs[w.segs.length-1];addFood(t.x,t.y,1.2,w.hue)}}
  const h=w.segs[0],r=R(w);h.x+=Math.cos(w.ang)*sp*dt;h.y+=Math.sin(w.ang)*sp*dt;
  const n=10+Math.floor(w.mass*.5),g=r*.55;
  while(w.segs.length<n){const l=w.segs[w.segs.length-1];w.segs.push({x:l.x,y:l.y})}
  while(w.segs.length>n)w.segs.pop();
  for(let i=1;i<w.segs.length;i++){const p=w.segs[i-1],s=w.segs[i],dx=p.x-s.x,dy=p.y-s.y,d=Math.hypot(dx,dy);if(d>g){s.x+=dx/d*(d-g);s.y+=dy/d*(d-g)}}
  for(let i=food.length-1;i>=0;i--){const f=food[i],dx=f.x-h.x,dy=f.y-h.y,d2=dx*dx+dy*dy,er=r+8+f.v*3;
   if(d2<er*er){w.mass+=f.v;food[i]=food[food.length-1];food.pop()}
   else if(d2<(r*2+50)*(r*2+50)){f.x-=dx*dt*4;f.y-=dy*dt*4}}
 }
 for(const a of worms){if(a.dead)continue;const h=a.segs[0],ra=R(a);
  if(h.x<0||h.y<0||h.x>WS||h.y>WS){die(a);continue}
  out:for(const b of worms){if(b===a||b.dead)continue;const lim=R(b)+ra*.6;
   for(let i=2;i<b.segs.length;i+=2){const s=b.segs[i],dx=s.x-h.x,dy=s.y-h.y;if(dx*dx+dy*dy<lim*lim){die(a);break out}}}}
 seed()}
function draw(){
 ctx.setTransform(D,0,0,D,0,0);ctx.fillStyle='#0f0820';ctx.fillRect(0,0,W,H);
 const h=focus.segs[0];cam.x+=(h.x-cam.x)*.15;cam.y+=(h.y-cam.y)*.15;
 const tz=Math.min(W,H)/620/(1+(R(focus)-10)*.03);Z+=(tz-Z)*.05;
 ctx.translate(W/2,H/2);ctx.scale(Z,Z);ctx.translate(-cam.x,-cam.y);
 const vw=W/Z/2+60,vh=H/Z/2+60,L=cam.x-vw,Rr=cam.x+vw,T=cam.y-vh,B=cam.y+vh;
 ctx.fillStyle='#1b1230';ctx.fillRect(0,0,WS,WS);
 ctx.fillStyle='#2f2356';ctx.beginPath();
 for(let x=Math.max(0,Math.floor(L/90)*90);x<=Math.min(WS,Rr);x+=90)for(let y=Math.max(0,Math.floor(T/90)*90);y<=Math.min(WS,B);y+=90){ctx.moveTo(x+3,y);ctx.arc(x,y,3,0,6.3)}
 ctx.fill();
 ctx.strokeStyle='#ff6b8a';ctx.lineWidth=10;ctx.strokeRect(0,0,WS,WS);
 for(const f of food){if(f.x<L||f.x>Rr||f.y<T||f.y>B)continue;const r=3+f.v*1.8;
  ctx.fillStyle='hsla('+f.h+',90%,65%,.25)';ctx.beginPath();ctx.arc(f.x,f.y,r*1.9,0,6.3);ctx.fill();
  ctx.fillStyle='hsl('+f.h+',90%,65%)';ctx.beginPath();ctx.arc(f.x,f.y,r,0,6.3);ctx.fill()}
 ctx.lineWidth=2;ctx.strokeStyle='rgba(20,10,40,.35)';
 for(const w of worms){if(w.dead)continue;const r=R(w),n=w.segs.length;
  if(w.bst&&w.mass>14){ctx.fillStyle='hsla('+w.hue+',90%,60%,.18)';for(let i=0;i<n;i+=2){const s=w.segs[i];ctx.beginPath();ctx.arc(s.x,s.y,r*1.6,0,6.3);ctx.fill()}}
  for(let i=n-1;i>=0;i--){const s=w.segs[i];if(s.x<L||s.x>Rr||s.y<T||s.y>B)continue;
   ctx.fillStyle='hsl('+w.hue+',80%,'+(i%2?58:50)+'%)';ctx.beginPath();ctx.arc(s.x,s.y,r*(.65+.35*(1-i/n)),0,6.3);ctx.fill();ctx.stroke()}
  const p=w.segs[0],c=Math.cos(w.ang),s=Math.sin(w.ang);
  for(const k of[-1,1]){const ex=p.x+c*r*.45-s*r*.5*k,ey=p.y+s*r*.45+c*r*.5*k;
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,r*.42,0,6.3);ctx.fill();
   ctx.fillStyle='#1b1230';ctx.beginPath();ctx.arc(ex+c*r*.15,ey+s*r*.15,r*.2,0,6.3);ctx.fill()}
  ctx.fillStyle='rgba(253,246,255,.85)';ctx.font='500 15px Fredoka,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(w.name,p.x,p.y-r-10)}}
function hud(){
 const live=worms.filter(w=>!w.dead).sort((a,b)=>b.mass-a.mass).slice(0,5);
 document.getElementById('lb').innerHTML=live.map(w=>'<div'+(w===me?' style="color:var(--acc)"':'')+'><span>'+w.name+'</span><b>'+Math.floor(w.mass)+'</b></div>').join('');
 document.getElementById('sc').textContent='Longueur '+Math.floor(me.mass)}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);draw();lbT+=dt;if(lbT>.25){lbT=0;hud()}requestAnimationFrame(loop)}
function start(){me=mk(false,window.vgUser||'Toi');worms[0]=me;focus=me;state='play';mouse.has=false;
 document.getElementById('menu').hidden=true;document.getElementById('over').hidden=true;
 cam.x=me.segs[0].x;cam.y=me.segs[0].y}
cv.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.has=true});
cv.addEventListener('pointerdown',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.has=true;if(e.pointerType==='mouse')boost=true});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse')boost=false});
const bt=document.getElementById('bt');
bt.addEventListener('pointerdown',e=>{boost=true;e.preventDefault()});
for(const ev of['pointerup','pointercancel','pointerleave'])bt.addEventListener(ev,()=>{boost=false});
addEventListener('keydown',e=>{if(e.code==='Space'){boost=true;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.code==='Space')boost=false});
document.getElementById('play').onclick=start;
document.getElementById('again').onclick=start;
init();requestAnimationFrame(loop);
</script>
<script type="module">
const cfg={apiKey:"AIzaSyAQqP7h_BZlOvLGDlPrC64Tn4eH3pISXEU",authDomain:"ver-glouton.firebaseapp.com",projectId:"ver-glouton",storageBucket:"ver-glouton.firebasestorage.app",messagingSenderId:"356988197856",appId:"1:356988197856:web:342aeedc0957b58affe985"};
const btn=document.getElementById('gin'),who=document.getElementById('who');
try{
 const V='10.14.1',B='https://www.gstatic.com/firebasejs/'+V+'/';
 const {initializeApp}=await import(B+'firebase-app.js');
 const {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut}=await import(B+'firebase-auth.js');
 const auth=getAuth(initializeApp(cfg));
 onAuthStateChanged(auth,u=>{
  window.vgUser=u?(u.displayName||'Joueur').split(' ')[0]:null;
  who.textContent=u?'Connecté : '+window.vgUser:'';
  btn.textContent=u?'Se déconnecter':'Se connecter avec Google';
 });
 btn.onclick=async()=>{
  if(auth.currentUser){await signOut(auth);return}
  const pr=new GoogleAuthProvider();
  try{await signInWithPopup(auth,pr)}
  catch(e){
   if(e.code==='auth/popup-blocked'){signInWithRedirect(auth,pr);return}
   who.textContent='Connexion impossible ('+(e.code||'erreur')+')';
  }
 };
}catch(e){btn.hidden=true}
</script>
</body>
</html>
